name: CI

on:
  workflow_dispatch:

# CI must never read application secrets or upload credentials as artifacts.
permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test & race
        run: |
          mkdir -p artifacts
          go test -count=1 -v ./... > artifacts/test.log
          go test -race -count=1 ./... > artifacts/race.log

      - name: go build
        run: go build ./...

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: artifacts/

  wasm-build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build js/wasm & assert bundle size budget
        run: |
          mkdir -p wasm-artifacts
          GOOS=js GOARCH=wasm go build -o wasm-artifacts/app.wasm ./...
          ls -lh wasm-artifacts/app.wasm | tee wasm-artifacts/bundle-size.txt

          size_bytes=$(wc -c < wasm-artifacts/app.wasm | tr -d ' ')
          size_kb=$((size_bytes / 1024))
          max_kb=15360 # 15 MB budget for uncompressed standard Go WASM

          echo "WASM binary size: ${size_kb} KB (${size_bytes} bytes)"
          if [ "$size_kb" -gt "$max_kb" ]; then
            echo "::error::WASM bundle size ${size_kb}KB exceeds maximum budget of ${max_kb}KB!"
            exit 1
          fi

          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### 📦 WASM Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
            echo "| Artifact | Size (KB) | Budget Limit (KB) | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`app.wasm\` | ${size_kb} KB | ${max_kb} KB | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: wasm-artifacts/

  cross-build:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
